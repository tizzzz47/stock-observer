<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股指数观察器</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        select,
        input,
        button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .result {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .result-box {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            min-width: 150px;
        }

        .result-box strong {
            display: block;
            font-size: 24px;
            margin-top: 8px;
        }

        #message {
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>美股指数观察器</h1>

    <div class="subtitle">
        观察 S&P 500 和 Nasdaq-100 的历史表现
    </div>

    <div class="card">

        <h2>选择指数</h2>

        <select id="indexSelect">
            <option value="SP500">S&P 500</option>
            <option value="NDX">Nasdaq-100</option>
        </select>

        <h2>选择日期</h2>

        <input type="date" id="startDate">
        <input type="date" id="endDate">

        <br>

        <button onclick="calculate()">计算</button>

    </div>

    <div class="card">

        <h2>结果</h2>

        <div class="result">

            <div class="result-box">
                累计收益率
                <strong id="returnValue">--</strong>
            </div>

            <div class="result-box">
                年化收益率
                <strong id="annualReturn">--</strong>
            </div>

            <div class="result-box">
                最大回撤
                <strong id="maxDrawdown">--</strong>
            </div>

        </div>

        <div id="message">
            正在读取历史数据……
        </div>

    </div>


    <script>

        let sp500Data = [];
        let ndxData = [];


        // 读取 S&P 500
        async function loadSP500() {

            const response = await fetch("sp500.csv");

            if (!response.ok) {
                throw new Error("无法读取 sp500.csv");
            }

            const text = await response.text();

            const lines = text.trim().split(/\r?\n/);

            const data = [];

            // 跳过第一行标题
            for (let i = 1; i < lines.length; i++) {

                const parts = lines[i].split(",");

                if (parts.length < 6) continue;

                // 第2列：日期
                const date = parts[1].replace(/"/g, "").split(" ")[0];

                // 第6列：Close
                const value = parseFloat(parts[5]);

                if (!isNaN(value)) {
                    data.push({
                        date: date,
                        value: value
                    });
                }
            }

            return data;
        }


        // 读取 Nasdaq-100
        async function loadNDX() {

            const response = await fetch("ndx.csv");

            if (!response.ok) {
                throw new Error("无法读取 ndx.csv");
            }

            const text = await response.text();

            const lines = text.trim().split(/\r?\n/);

            const data = [];

            // 跳过第一行标题
            for (let i = 1; i < lines.length; i++) {

                const parts = lines[i].split(",");

                if (parts.length < 2) continue;

                const date = parts[0].trim();
                const value = parseFloat(parts[1]);

                if (!isNaN(value)) {
                    data.push({
                        date: date,
                        value: value
                    });
                }
            }

            return data;
        }


        // 页面打开时读取数据
        async function loadData() {

            const message = document.getElementById("message");

            try {

                sp500Data = await loadSP500();
                ndxData = await loadNDX();

                message.textContent =
                    `数据读取成功：S&P 500 ${sp500Data.length} 条，Nasdaq-100 ${ndxData.length} 条。`;

            } catch (error) {

                console.error(error);

                message.textContent =
                    "读取数据失败：" + error.message;
            }
        }


        // 计算
        function calculate() {

            const index = document.getElementById("indexSelect").value;
            const start = document.getElementById("startDate").value;
            const end = document.getElementById("endDate").value;

            const message = document.getElementById("message");

            if (!start || !end) {
                message.textContent = "请先选择开始日期和结束日期。";
                return;
            }

            if (start >= end) {
                message.textContent = "结束日期必须晚于开始日期。";
                return;
            }


            const data =
                index === "SP500" ? sp500Data : ndxData;


            const selected = data.filter(item =>
                item.date >= start && item.date <= end
            );


            if (selected.length < 2) {

                message.textContent =
                    "这个日期范围内没有足够的数据。";

                return;
            }


            const firstValue = selected[0].value;
            const lastValue = selected[selected.length - 1].value;


            // 累计收益率
            const totalReturn =
                (lastValue / firstValue - 1) * 100;


            // 年化收益率
            const startTime =
                new Date(selected[0].date).getTime();

            const endTime =
                new Date(selected[selected.length - 1].date).getTime();

            const years =
                (endTime - startTime) /
                (365.25 * 24 * 60 * 60 * 1000);

            const annualReturn =
                (Math.pow(lastValue / firstValue, 1 / years) - 1) * 100;


            // 最大回撤
            let peak = selected[0].value;
            let maxDrawdown = 0;

            for (const item of selected) {

                if (item.value > peak) {
                    peak = item.value;
                }

                const drawdown =
                    (item.value / peak - 1) * 100;

                if (drawdown < maxDrawdown) {
                    maxDrawdown = drawdown;
                }
            }


            document.getElementById("returnValue").textContent =
                totalReturn.toFixed(2) + "%";

            document.getElementById("annualReturn").textContent =
                annualReturn.toFixed(2) + "%";

            document.getElementById("maxDrawdown").textContent =
                maxDrawdown.toFixed(2) + "%";


            message.textContent =
                `使用 ${index === "SP500" ? "S&P 500" : "Nasdaq-100"} 数据，共 ${selected.length} 个交易日。`;
        }


        loadData();

    </script>

</body>
</html>
