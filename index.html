<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股指数观察器</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        select,
        input,
        button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .result {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .result-box {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            min-width: 150px;
        }

        .result-box strong {
            display: block;
            font-size: 24px;
            margin-top: 8px;
        }

        #message {
            margin-top: 20px;
            color: #666;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 450px;
        }
    </style>
</head>

<body>

    <h1>美股指数观察器</h1>

    <div class="subtitle">
        观察 S&P 500 和 Nasdaq-100 的历史表现
    </div>

    <div class="card">

        <h2>选择指数</h2>

        <select id="indexSelect">
            <option value="SP500">S&P 500</option>
            <option value="NDX">Nasdaq-100</option>
        </select>

        <h2>选择日期</h2>

        <input type="date" id="startDate">
        <input type="date" id="endDate">

        <br>

        <button onclick="calculate()">计算</button>

    </div>

    <div class="card">

        <h2>结果</h2>

        <div class="result">

            <div class="result-box">
                累计收益率
                <strong id="returnValue">--</strong>
            </div>

            <div class="result-box">
                年化收益率
                <strong id="annualReturn">--</strong>
            </div>

            <div class="result-box">
                最大回撤
                <strong id="maxDrawdown">--</strong>
            </div>

        </div>

        <div id="message">
            正在读取历史数据……
        </div>

    </div>

    <div class="card">

        <h2>历史走势</h2>

        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>

    </div>


    <script>

        let sp500Data = [];
        let ndxData = [];

        let priceChart = null;


        // =========================
        // 读取 S&P 500
        // =========================

        async function loadSP500() {

            const response = await fetch("sp500.csv");

            if (!response.ok) {
                throw new Error("无法读取 sp500.csv");
            }

            const text = await response.text();

            const lines = text.trim().split(/\r?\n/);

            const data = [];

            for (let i = 1; i < lines.length; i++) {

                const parts = lines[i].split(",");

                if (parts.length < 6) continue;

                const date =
                    parts[1]
                    .replace(/"/g, "")
                    .split(" ")[0];

                const value =
                    parseFloat(parts[5]);

                if (!isNaN(value)) {

                    data.push({
                        date: date,
                        value: value
                    });

                }
            }

            return data;
        }


        // =========================
        // 读取 Nasdaq-100
        // =========================

        async function loadNDX() {

            const response = await fetch("ndx.csv");

            if (!response.ok) {
                throw new Error("无法读取 ndx.csv");
            }

            const text = await response.text();

            const lines = text.trim().split(/\r?\n/);

            const data = [];

            for (let i = 1; i < lines.length; i++) {

                const parts = lines[i].split(",");

                if (parts.length < 2) continue;

                const date =
                    parts[0].trim();

                const value =
                    parseFloat(parts[1]);

                if (!isNaN(value)) {

                    data.push({
                        date: date,
                        value: value
                    });

                }
            }

            return data;
        }


        // =========================
        // 页面打开时读取数据
        // =========================

        async function loadData() {

            const message =
                document.getElementById("message");

            try {

                sp500Data =
                    await loadSP500();

                ndxData =
                    await loadNDX();

                message.textContent =
                    `数据读取成功：S&P 500 ${sp500Data.length} 条，Nasdaq-100 ${ndxData.length} 条。`;

            } catch (error) {

                console.error(error);

                message.textContent =
                    "读取数据失败：" + error.message;
            }
        }


        // =========================
        // 找到最大回撤
        // =========================

        function findMaxDrawdown(selected) {

            let peakIndex = 0;
            let maxDrawdown = 0;

            let maxPeakIndex = 0;
            let maxBottomIndex = 0;


            for (let i = 0; i < selected.length; i++) {

                // 如果出现新的最高点
                if (
                    selected[i].value >
                    selected[peakIndex].value
                ) {

                    peakIndex = i;

                }


                const drawdown =
                    selected[i].value /
                    selected[peakIndex].value -
                    1;


                // 找到新的最大回撤
                if (drawdown < maxDrawdown) {

                    maxDrawdown = drawdown;

                    maxPeakIndex = peakIndex;
                    maxBottomIndex = i;

                }

            }


            return {
                drawdown: maxDrawdown * 100,
                peakIndex: maxPeakIndex,
                bottomIndex: maxBottomIndex
            };

        }


        // =========================
        // 绘制历史走势图
        // =========================

        function drawChart(
            selected,
            indexName,
            maxDrawdownInfo
        ) {

            const canvas =
                document.getElementById("priceChart");


            if (priceChart) {

                priceChart.destroy();

            }


            // 最多绘制约1500个点
            const maxPoints = 1500;

            let chartData = selected;

            if (selected.length > maxPoints) {

                const step =
                    Math.ceil(selected.length / maxPoints);

                chartData =
                    selected.filter((item, index) =>
                        index % step === 0
                    );


                if (
                    chartData[chartData.length - 1] !==
                    selected[selected.length - 1]
                ) {

                    chartData.push(
                        selected[selected.length - 1]
                    );

                }

            }


            const labels =
                chartData.map(item => item.date);

            const values =
                chartData.map(item => item.value);


            const ctx =
                canvas.getContext("2d");


            // 找到最大回撤高点和低点
            const peak =
                selected[maxDrawdownInfo.peakIndex];

            const bottom =
                selected[maxDrawdownInfo.bottomIndex];


            // 找到它们在绘图数据中的位置
            let peakChartIndex =
                chartData.findIndex(
                    item => item.date === peak.date
                );

            let bottomChartIndex =
                chartData.findIndex(
                    item => item.date === bottom.date
                );


            // 如果因为抽样没有刚好留下这两个点，
            // 找最近的绘图点
            if (peakChartIndex === -1) {

                peakChartIndex = chartData.reduce(
                    (best, item, index) => {

                        const currentDiff =
                            Math.abs(
                                new Date(item.date) -
                                new Date(peak.date)
                            );

                        const bestDiff =
                            Math.abs(
                                new Date(chartData[best].date) -
                                new Date(peak.date)
                            );

                        return currentDiff < bestDiff
                            ? index
                            : best;

                    },
                    0
                );

            }


            if (bottomChartIndex === -1) {

                bottomChartIndex = chartData.reduce(
                    (best, item, index) => {

                        const currentDiff =
                            Math.abs(
                                new Date(item.date) -
                                new Date(bottom.date)
                            );

                        const bestDiff =
                            Math.abs(
                                new Date(chartData[best].date) -
                                new Date(bottom.date)
                            );

                        return currentDiff < bestDiff
                            ? index
                            : best;

                    },
                    0
                );

            }


            // 创建特殊标记数据
            const peakPoints =
                values.map((value, index) =>
                    index === peakChartIndex
                        ? value
                        : null
                );


            const bottomPoints =
                values.map((value, index) =>
                    index === bottomChartIndex
                        ? value
                        : null
                );


            priceChart =
                new Chart(ctx, {

                    type: "line",

                    data: {

                        labels: labels,

                        datasets: [

                            {
                                label: indexName,

                                data: values,

                                borderWidth: 1.5,

                                pointRadius: 0,

                                tension: 0
                            },

                            {
                                label: "最大回撤起点",

                                data: peakPoints,

                                pointRadius: 7,

                                pointHoverRadius: 9,

                                showLine: false
                            },

                            {
                                label: "最大回撤终点",

                                data: bottomPoints,

                                pointRadius: 7,

                                pointHoverRadius: 9,

                                showLine: false
                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        interaction: {

                            mode: "index",

                            intersect: false

                        },

                        plugins: {

                            legend: {

                                display: true

                            },

                            tooltip: {

                                callbacks: {

                                    afterTitle: function() {

                                        return "";

                                    }

                                }

                            }

                        },

                        scales: {

                            x: {

                                ticks: {

                                    maxTicksLimit: 10

                                }

                            },

                            y: {

                                beginAtZero: false

                            }

                        }

                    }

                });

        }


        // =========================
        // 计算
        // =========================

        function calculate() {

            const index =
                document.getElementById("indexSelect").value;

            const start =
                document.getElementById("startDate").value;

            const end =
                document.getElementById("endDate").value;

            const message =
                document.getElementById("message");


            if (!start || !end) {

                message.textContent =
                    "请先选择开始日期和结束日期。";

                return;
            }


            if (start >= end) {

                message.textContent =
                    "结束日期必须晚于开始日期。";

                return;
            }


            const data =
                index === "SP500"
                    ? sp500Data
                    : ndxData;


            const selected =
                data.filter(item =>
                    item.date >= start &&
                    item.date <= end
                );


            if (selected.length < 2) {

                message.textContent =
                    "这个日期范围内没有足够的数据。";

                return;
            }


            const firstValue =
                selected[0].value;

            const lastValue =
                selected[selected.length - 1].value;


            // =========================
            // 累计收益率
            // =========================

            const totalReturn =
                (lastValue / firstValue - 1) * 100;


            // =========================
            // 年化收益率
            // =========================

            const startTime =
                new Date(selected[0].date).getTime();

            const endTime =
                new Date(selected[selected.length - 1].date).getTime();

            const years =
                (endTime - startTime) /
                (365.25 * 24 * 60 * 60 * 1000);

            const annualReturn =
                (Math.pow(
                    lastValue / firstValue,
                    1 / years
                ) - 1) * 100;


            // =========================
            // 最大回撤
            // =========================

            const maxDrawdownInfo =
                findMaxDrawdown(selected);


            // =========================
            // 显示结果
            // =========================

            document.getElementById("returnValue")
                .textContent =
                totalReturn.toFixed(2) + "%";


            document.getElementById("annualReturn")
                .textContent =
                annualReturn.toFixed(2) + "%";


            document.getElementById("maxDrawdown")
                .textContent =
                maxDrawdownInfo.drawdown.toFixed(2) + "%";


            const indexName =
                index === "SP500"
                    ? "S&P 500"
                    : "Nasdaq-100";


            message.textContent =
                `使用 ${indexName} 数据，共 ${selected.length} 个交易日。最大回撤发生于 ${selected[maxDrawdownInfo.peakIndex].date} → ${selected[maxDrawdownInfo.bottomIndex].date}。`;


            // =========================
            // 绘制走势图
            // =========================

            drawChart(
                selected,
                indexName,
                maxDrawdownInfo
            );

        }


        // 页面打开时读取数据
        loadData();

    </script>

</body>
</html>
